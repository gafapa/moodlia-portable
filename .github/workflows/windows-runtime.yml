name: Windows runtime diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - shell: pwsh
        run: icacls "$env:GITHUB_WORKSPACE" /grant "${env:USERNAME}:(OI)(CI)F" /Q
      - run: python scripts/build.py --moodle-version 4.5.15
      - run: python scripts/qualify.py --moodle-version 4.5.15
      - name: Inspect restricted process path permissions
        if: failure()
        shell: pwsh
        run: |
          whoami
          Write-Output "Command interpreter: $env:COMSPEC"
          $paths = @('build/portable', 'build/portable/runtime/postgres/bin/postgres.exe', 'test-workspaces/4.5.15-plugin', 'test-workspaces/4.5.15-plugin/data', 'test-workspaces/4.5.15-plugin/data/logs', 'test-workspaces/4.5.15-plugin/data/postgres')
          foreach ($path in $paths) { icacls $path }
          $cluster = Join-Path $env:GITHUB_WORKSPACE 'test-workspaces/4.5.15-plugin/data/postgres'
          $temporaryLog = Join-Path $env:RUNNER_TEMP 'postgres-diagnostic.log'
          & build/portable/runtime/postgres/bin/pg_ctl.exe -D $cluster -l $temporaryLog -o '-h 127.0.0.1 -p 55439' -w start
          if (Test-Path $temporaryLog) { Get-Content $temporaryLog -Tail 30 }
          & build/portable/runtime/postgres/bin/pg_ctl.exe -D $cluster -m fast -w stop
