name: Native packages
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
          - os: macos-15-intel
            architecture: x64
          - os: macos-latest
            architecture: arm64
          - os: ubuntu-22.04
            architecture: x64
          - os: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: npm test
      - run: python scripts/build.py
      - name: Verify each version with and without the plugin
        run: python scripts/qualify.py
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Windows system installation and workspace preservation
        if: runner.os == 'Windows'
        run: python scripts/windows_installer_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: MoodlIA-${{ runner.os }}-${{ matrix.architecture }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
            build/qualification.json
          if-no-files-found: error
